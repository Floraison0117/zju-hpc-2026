engine:
  dtype: bfloat16
  device: cuda
  max_batch_size: 2
  scheduler_batch_size: 2
  max_sequence_length: 2048
  attention_backend: flash
  linear_backend: int4_hybrid
  scheduler_backend: continuous_batch
  seed: 0
  synchronize_metrics: false
  weight_offload: async
  kv_cache_backend: ring_indexed
  compact_active_slots: false

quantization:
  algorithm: gptq
  version: 1
  bits: 4
  group_size: 128
  symmetric: true
  scale_dtype: float16
  packing: uint8_little_nibble
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  calibration:
    gptq:
      block_size: 128
      damp_percent: 0.01
  propagate_quantized: true

calibration:
  path: datasets/calibration-256.jsonl
  limit: 256
  micro_batch_size: 1
  max_tokens: 4096
